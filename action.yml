name: 'Crysk'
description: 'Multi-agent AI code review engine with adversarial refutation. Its commit status is a gate by default (mode: gate); mode: advisory keeps it green'
author: 'juanmaagd'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token used for PR comments and API access'
    required: false
    default: '${{ github.token }}'
  anthropic-api-key:
    description: 'Removed: pass CRYSK_CLAUDE_API_KEY in crysk-secrets instead. Declared only so a workflow that still passes a value stops at the trigger (CRYSK-INPUT-REMOVED) before anything is installed. Leave it out.'
    required: false
  claude-token:
    description: 'Removed: pass CRYSK_CLAUDE_OAUTH_TOKEN in crysk-secrets instead. Declared only so a workflow that still passes a value stops at the trigger (CRYSK-INPUT-REMOVED) before anything is installed. Leave it out.'
    required: false
  routing:
    description: 'Removed: set the models per role in the models input instead (from vars.CRYSK_MODELS), or in the Crysk platform''s model settings for a connected repository. Declared only so a workflow that still passes a value stops at the trigger (CRYSK-INPUT-REMOVED) before anything is installed. Leave it out.'
    required: false
    default: ''
  opencode-auth:
    description: 'Removed: pass one CRYSK_OPENCODE_<PROVIDER>_API_KEY per provider (CRYSK_OPENCODE_OPENAI_OAUTH for an OpenAI subscription) in crysk-secrets instead. Declared only so a workflow that still passes a value stops at the trigger (CRYSK-INPUT-REMOVED) before anything is installed. Leave it out.'
    required: false
  models:
    description: 'The models per role, as JSON: the models object of the personal config, from role (default, hunter.logic, judge, ...) to an ordered list of models, the first one tried first, e.g. {"default": ["claude:sonnet-latest"], "hunter.logic": ["opencode:deepseek/deepseek-chat", "claude:sonnet-latest"]}. An entry is a model name or {"model": ..., "effort": ...}. Pass it from a repository variable, models: followed by the vars.CRYSK_MODELS expression. Read by the setup step only, with the engine''s own parser, and written to the runner''s personal config file; a malformed value fails the run (CRYSK-CONFIG-INVALID). A repository connected to the Crysk platform takes its models from the platform''s model settings, which win whole: this input and credentials are then ignored with a warning. Empty: every role runs the default Claude model.'
    required: false
    default: ''
  credentials:
    description: 'Which Claude credential the review uses, and in what order, as JSON, e.g. {"claude": ["subscription", "api_key"]} (subscription is CRYSK_CLAUDE_OAUTH_TOKEN, api_key is CRYSK_CLAUDE_API_KEY, both in crysk-secrets). Pass it from a repository variable, credentials: followed by the vars.CRYSK_CREDENTIALS expression. Read and written like models, beside it. Empty: the subscription first.'
    required: false
    default: ''
  crysk-secrets:
    description: 'The Crysk credentials, the only way to pass them: NAME=value lines, one per CRYSK_* secret, each written by the workflow as CRYSK_X= followed by the secrets.CRYSK_X expression, never toJSON(secrets). Names: CRYSK_CLAUDE_OAUTH_TOKEN (claude setup-token), CRYSK_CLAUDE_API_KEY, CRYSK_OPENCODE_<P>_API_KEY and CRYSK_OPENCODE_<P>_OAUTH (base64 -w0 of the provider record, openai only), <P> being the provider id uppercased with - and . as _. A secret the repository does not have arrives empty and counts as absent; an unused platform slot, the line CRYSK_OPENCODE__API_KEY= with nothing after it, is skipped. The trigger stops a run with no CRYSK_* credential (and no login on the runner). The setup step builds the OpenCode auth file from the CRYSK_OPENCODE_* secrets the models need, and the review chooses its Claude credential from the CRYSK_CLAUDE_* secrets in the credentials.claude order (subscription first by default). The input is read on stdin by those three steps only, every value is masked, and none reaches a child process through its environment: the Claude CLI gets only the chosen credential.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number. Defaults to the triggering pull_request/issue_comment event.'
    required: false
  model:
    description: 'Optional Claude model override for every agent'
    required: false
  scout:
    description: 'Run the experimental diff-only scout stage before hunting'
    required: false
    default: 'false'
  max-changed-lines:
    description: 'Size gate: skip the review when the diff exceeds this many changed lines. 0 disables the limit. Leave unset to use the repo config value max_changed_lines; when that is unset too, it resolves from the route billing mode - no limit on a Claude subscription (a run draws on quota, not a per-token invoice), 4000 on a metered route (CRYSK_CLAUDE_API_KEY chosen, or an OpenCode model with its CRYSK_OPENCODE_* secret).'
    required: false
  max-changed-files:
    description: 'Size gate: skip the review when the diff exceeds this many changed files. 0 disables the limit. Leave unset to use the repo config value max_changed_files; when that is unset too, it resolves from the route billing mode - no limit on a Claude subscription, 50 on a metered route.'
    required: false
  budget-usd:
    description: 'Spend gate: skip the review when its estimated cost exceeds this USD ceiling. Leave unset to resolve the ceiling from the route billing mode - no ceiling on a Claude subscription (a run draws on quota, not a per-token invoice), a default ceiling on a metered route (CRYSK_CLAUDE_API_KEY chosen, or an OpenCode model with its CRYSK_OPENCODE_* secret). An explicit value is honoured on any route; a value <= 0 disables the ceiling (the size limits above resolve separately).'
    required: false
    default: ''
  mode:
    description: 'gate (default): the crysk commit status, the required check, turns failure on blocking findings or a size/budget skip and error on a crash, and success on a clean or advisory-only review. Comment /crysk review to review a skipped head anyway. advisory: the status is always success for a finished review, as before.'
    required: false
    default: 'gate'
  post:
    description: 'Publish findings as inline PR comments and a review'
    required: false
    default: 'true'
  step-summary:
    description: 'Write a Markdown summary to the job step summary'
    required: false
    default: 'true'
  force:
    description: 'Bypass CI skip gates for this run: the size gate, review-policy admission, and the budget ceiling. A pull request comment that is exactly `/crysk review` (or `/crysk review --full`) from a user with write access sets it on its own, with no input; a workflow_dispatch caller, such as a pr-hero-force.yml scaffolded before the comment trigger, can still pass it explicitly.'
    required: false
    default: 'false'
  full:
    description: 'On a re-review, widen discovery to the full pull request range instead of only the commits since the last completed review. Use it when a prior review of the same head was hollow or wrong and later runs report "No changes to discover"; `force` alone never widens discovery. A `/crysk review --full` comment sets it on its own.'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Review outcome: reviewed, skipped-size, skipped-budget, skipped-excluded, or error'
    value: ${{ steps.run-crysk.outputs.status }}
  findings-count:
    description: 'Total number of verified findings'
    value: ${{ steps.run-crysk.outputs.findings_count }}
  blocking-count:
    description: 'Total number of blocking-tier findings'
    value: ${{ steps.run-crysk.outputs.blocking_count }}
  advisory-count:
    description: 'Total number of advisory-tier findings'
    value: ${{ steps.run-crysk.outputs.advisory_count }}
  cost-usd-est:
    description: 'Estimated cost of the review, in USD'
    value: ${{ steps.run-crysk.outputs.cost_usd_est }}
  run-dir:
    description: 'Path to the run directory containing findings.json and report.md'
    value: ${{ steps.run-crysk.outputs.run_dir }}

# No `runs-on` here on purpose: a composite action runs on whatever runner
# the CALLING workflow's job selects (spec 1.1 requires ubuntu-latest AND
# macos-latest support). Every step below is plain POSIX shell with no
# OS-specific flags, so both runners are supported without a matrix here.
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Pinned, not `latest`: a published Action's toolchain should be
        # reproducible run to run, not a moving target. The one pin is
        # package.json's `packageManager`; read from the Action's own copy,
        # never the caller's repository, which has its own package.json.
        bun-version-file: ${{ github.action_path }}/package.json

    # Platform mode: the Crysk platform dispatched this run (a workflow_dispatch
    # carrying a `dispatch-id`), so it trades the run's OIDC token for an
    # installation token of the Crysk App and every later step uses that instead
    # of `github.token`: reviews post as the App's bot. A standalone run has no
    # dispatch id, skips this step, and takes exactly the path it always did.
    #
    # WHY it runs before the trigger and fails the job: the trigger's own `gh`
    # calls already need the token, and in platform mode a silent fallback to
    # `github.token` would post under the wrong identity. A failure (id-token
    # permission missing, a 401/403/409/429 from the platform) goes RED here.
    # The platform URL is a constant in src/ci/platform.ts, never an input: the
    # dispatch inputs are caller-controlled, and the OIDC token goes to that URL.
    # The stub declares `dispatch-id` as a workflow input and does not forward it
    # to this action, so it is read off the event. Builtins only, like the
    # trigger: it runs before `bun install`.
    - name: Connect to Crysk
      id: platform
      if: github.event_name == 'workflow_dispatch' && github.event.inputs['dispatch-id'] != ''
      shell: bash
      env:
        # E-f F5: the five Claude variables, emptied for every process this step
        # starts. A job-level value (env: on the job or the workflow) would
        # otherwise reach every git, gh, npm and bun child; the review takes its
        # Claude credential from the crysk-secrets input only. A CRYSK_OPENCODE_*
        # name is per provider and cannot be emptied here, so the trigger and the
        # run step warn about one instead (src/ci/crysk-secrets.ts).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        CRYSK_DISPATCH_ID: ${{ github.event.inputs['dispatch-id'] }}
        # Where the platform's review configuration is left for the setup step:
        # under the runner's temp directory, never the workspace. Bound here
        # ONLY: the refresh steps below leave it unset, so they never touch it.
        CRYSK_PLATFORM_CONFIG_DIR: ${{ runner.temp }}/crysk-platform
      run: bun "${{ github.action_path }}/src/ci/platform.ts"

    # The trigger decides whether this run reviews at all, and it runs FIRST,
    # before `bun install`, so an ignored comment or a fork PR costs seconds
    # instead of a dependency install (that is also why src/ci/trigger.ts
    # imports only builtins). The calling workflow listens to `pull_request`
    # and `issue_comment`, and its job `if:` already drops fork PRs and
    # comments that do not start with `/crysk review`. This step re-checks
    # all of it instead of trusting the caller: a comment must be exactly
    # `/crysk review` or `/crysk review --full`, from a user with write
    # or admin access, no removed input may hold a value, and at least one
    # credential must be set. A same-repo run that fails either goes RED here
    # instead of skipping green. It also resolves
    # the PR number, `force`, `full` and the head sha, and every later step
    # is gated on its `run` output.
    #
    # Event values reach it ONLY through `env:`. The comment body is free
    # text anyone can type; spliced into a script it is command injection.
    # The removed inputs arrive as presence booleans (`!= ''`), never as
    # values. The crysk-secrets input cannot: the workflow passes one line per
    # CRYSK_* name, empty when the secret is unset, so the input is never empty
    # and presence needs its parse. It is piped on stdin exactly as the setup
    # step takes it (bun runs with the variable emptied, so no `gh` call sees
    # it), and the trigger keeps only whether a CRYSK_* credential is there.
    - name: Resolve trigger
      id: trigger
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        # The commenter-permission and PR-head lookups go through `gh`.
        GH_TOKEN: ${{ steps.platform.outputs.github-token || inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Set only when the commented issue is a pull request.
        EVENT_ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
        # The triggering comment's id, which the reaction names. Empty on a
        # pull_request event; the trigger accepts digits only.
        EVENT_COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        FORCE_INPUT: ${{ inputs.force }}
        FULL_INPUT: ${{ inputs.full }}
        # The inputs the clean break removed (U5): any with a value stops the run
        # (CRYSK-INPUT-REMOVED). Presence only, never a value.
        HAS_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key != '' }}
        HAS_CLAUDE_TOKEN: ${{ inputs.claude-token != '' }}
        HAS_OPENCODE_AUTH: ${{ inputs.opencode-auth != '' }}
        HAS_ROUTING: ${{ inputs.routing != '' }}
        # The trigger writes its decision to trigger.json here; the publish
        # step reads it. The run step writes the cli-started marker here too.
        # One path, bound the same way in all three steps (T2b).
        CRYSK_OUTCOME_DIR: ${{ runner.temp }}/pr-hero-outcome
        # Presence only, never the models text: whether the models in effect
        # name OpenCode. It names the backend of a no-credential outcome. The
        # platform's models win over the models input (D1): its output is `true`
        # or `false` when the platform sent models, and empty otherwise (then the
        # input decides). The routing input no longer counts: a value there
        # stops the run (HAS_ROUTING above).
        HAS_OPENCODE_ROUTING: ${{ steps.platform.outputs.routing-opencode == 'true' || (steps.platform.outputs.routing-opencode == '' && contains(inputs.models, 'opencode:')) }}
        # The attempt of this run. A re-run keeps the run id, so the record names
        # the attempt, and the publisher orders a re-run's comments by it.
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        # Piped to trigger.ts on stdin, never left in its environment (above).
        CRYSK_SECRETS_INPUT: ${{ inputs.crysk-secrets }}
      run: printf '%s' "$CRYSK_SECRETS_INPUT" | CRYSK_SECRETS_INPUT= bun "${{ github.action_path }}/src/ci/trigger.ts" --crysk-secrets-stdin

    - name: Install dependencies
      if: steps.trigger.outputs.run == 'true'
      shell: bash
      # --omit=optional skips the `bun` npm package (the npx launcher's Bun, about 85 MiB):
      # setup-bun already put Bun on PATH, and the engine's own dependencies are not optional.
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
      run: |
        if [ -f "${{ github.action_path }}/package.json" ]; then
          cd "${{ github.action_path }}" && bun install --frozen-lockfile --omit=optional
        fi

    - name: Install Claude Code CLI
      if: steps.trigger.outputs.run == 'true'
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
      run: |
        if ! command -v claude >/dev/null 2>&1; then
          npm install -g @anthropic-ai/claude-code
        fi

    - name: Materialize OpenCode CI data
      id: materialize
      if: steps.trigger.outputs.run == 'true'
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        # The removed routing and opencode-auth inputs are not bound: the trigger
        # stops any run that passes a value in them (U5), and setup.ts no longer
        # reads them (D6).
        # The models per role and the Claude credential order (D1), bound only
        # here. setup.ts reads them with the engine's person parser and writes
        # them as the personal config file, unless the platform sent a person
        # layer, which wins whole (the inputs are then ignored with a warning).
        # Not secrets: repository variables, never a value from crysk-secrets.
        MODELS_INPUT: ${{ inputs.models }}
        CREDENTIALS_INPUT: ${{ inputs.credentials }}
        # Platform mode only: the file the connect step left (empty in a
        # standalone run, which then changes nothing). The step writes the
        # platform's `person` layer to the personal config file, and its
        # `repo` layer, only when the checkout has no repo config of its own,
        # to a temp file it names in its `repo-config` output.
        CRYSK_PLATFORM_CONFIG_FILE: ${{ steps.platform.outputs.config-file }}
        # Presence only: whether the connect step ran, so a connected run with
        # no platform configuration still owns the personal config file and
        # drops what an earlier run left in it on a runner whose HOME persists.
        CRYSK_PLATFORM_CONNECTED: ${{ steps.platform.outputs.github-token != '' }}
        # A refused crysk-secrets input leaves setup.json here, so the publish
        # step names that secret instead of reporting "an install step failed".
        CRYSK_OUTCOME_DIR: ${{ runner.temp }}/pr-hero-outcome
        # The CRYSK_* secrets (S8), bound only in the steps that read them: the
        # trigger (presence), this step and Run Crysk, never the installers.
        # The shell pipes them to setup.ts on stdin (printf is a builtin, so no
        # process sees them in its argv) and runs bun with the variable emptied:
        # Bun hands a child the environment it started with, so a variable bun
        # received would reach git on the platform path. setup.ts masks every
        # value, builds the OpenCode auth file from the CRYSK_OPENCODE_* secrets
        # the models need, and outputs presence only (crysk-secrets,
        # claude-credentials, opencode-providers, opencode-auth-file), never a
        # value and never to GITHUB_ENV.
        CRYSK_SECRETS_INPUT: ${{ inputs.crysk-secrets }}
      run: printf '%s' "$CRYSK_SECRETS_INPUT" | CRYSK_SECRETS_INPUT= bun "${{ github.action_path }}/src/ci/setup.ts" --crysk-secrets-stdin

    # Pin 1.18.30 as its own step so GITHUB_PATH updates later steps only
    # (install ≠ Run Crysk). Never unpinned. Digest verify of the official
    # installer is named, not built.
    #
    # Installed when the setup step wrote an OpenCode auth file from the
    # CRYSK_OPENCODE_* secrets, or when the models in effect name OpenCode
    # (L28 decision 3): a self-hosted runner's own auth file, or a free model
    # that needs no credential, still gets the CLI. opencode-models is the setup
    # step's reading of the models in effect, the platform's or the models
    # input's (E-f F3).
    - name: Install OpenCode CLI
      if: ${{ steps.trigger.outputs.run == 'true' && (steps.materialize.outputs.opencode-auth-file == 'true' || steps.materialize.outputs.opencode-models == 'true' || steps.platform.outputs.routing-opencode == 'true') }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
      run: |
        curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.30
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Run Crysk
      id: run-crysk
      if: steps.trigger.outputs.run == 'true'
      shell: bash
      env:
        # The Claude variables, emptied for the whole CLI process (E-f F5, see
        # Connect to Crysk): a job-level value must not reach git, gh or the
        # OpenCode server child (OpenCode reads ANTHROPIC_API_KEY for its own
        # anthropic provider). The Claude CLI child gets the chosen credential
        # from the run env instead.
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        # Every `${{ inputs.* }}` / `${{ github.* }}` value pr-hero needs is
        # bound here, through `env:`, and referenced below as a QUOTED shell
        # variable — never interpolated directly into the script body. A
        # free-text input (model, in particular) is attacker-influenceable
        # on a `pull_request_target`-triggered workflow; splicing it
        # straight into the script would be a command-injection hole.
        GITHUB_TOKEN: ${{ steps.platform.outputs.github-token || inputs.github-token }}
        # The login the platform returned for the App's bot, empty in a
        # standalone run: the answered-findings gate trusts it as a poster.
        CRYSK_PLATFORM_ACTOR: ${{ steps.platform.outputs.github-actor }}
        CRYSK_OUTCOME_DIR: ${{ runner.temp }}/pr-hero-outcome
        # Platform mode only, and only for a checkout with no repo config of its
        # own: the temp file holding the platform's repo layer, handed to the
        # CLI's `--config` (which repoints the repo layer and nothing else).
        CRYSK_REPO_CONFIG: ${{ steps.materialize.outputs.repo-config }}
        # Platform mode only: `true` when the platform's configuration sets
        # `post`. The run step then leaves `--post` out, because an explicit CLI
        # option outranks the config and the platform's value would never apply.
        POST_FROM_PLATFORM: ${{ steps.materialize.outputs.post-from-platform }}
        # The CRYSK_* secrets (S8, U5), piped to src/ci/run.ts on stdin by the
        # last command below and emptied for bun, as in the setup step. run.ts
        # hands only the Claude values to the review's credential choice
        # (credentials.claude), never through the environment, so no git, gh or
        # agent child inherits them; the child gets exactly the chosen one under
        # the CLI's own variable. A job-level ANTHROPIC_API_KEY or
        # CLAUDE_CODE_OAUTH_TOKEN is not read either: run.ts drops them.
        CRYSK_SECRETS_INPUT: ${{ inputs.crysk-secrets }}
        GITHUB_ACTIONS: 'true'
        CI: 'true'
        NO_COLOR: '1'
        # Resolved by the trigger step from the event and from the
        # `pr-number` / `force` / `full` inputs, which still flow through it,
        # so a legacy workflow_dispatch caller keeps working unchanged.
        TRIGGER_PR: ${{ steps.trigger.outputs.pr }}
        TRIGGER_FORCE: ${{ steps.trigger.outputs.force }}
        TRIGGER_FULL: ${{ steps.trigger.outputs.full }}
        TRIGGER_ADJUDICATE: ${{ steps.trigger.outputs.adjudicate }}
        MODEL_INPUT: ${{ inputs.model }}
        SCOUT_INPUT: ${{ inputs.scout }}
        MAX_CHANGED_LINES_INPUT: ${{ inputs.max-changed-lines }}
        MAX_CHANGED_FILES_INPUT: ${{ inputs.max-changed-files }}
        BUDGET_USD_INPUT: ${{ inputs.budget-usd }}
        MODE_INPUT: ${{ inputs.mode }}
        POST_INPUT: ${{ inputs.post }}
        STEP_SUMMARY_INPUT: ${{ inputs.step-summary }}
      run: |
        : > "$CRYSK_OUTCOME_DIR/cli-started"
        # The line above is the first thing this step does, before anything
        # else can fail. WHY: the publish step must tell "an earlier step failed"
        # (no marker) from "the CLI ran and owns its own output" (marker). It
        # reads these markers and nothing else, so it needs no steps.<id>.outcome.
        #
        # NEVER redirect stderr away in this step: pr-hero's log() writes to
        # process.stderr unconditionally, and GitHub Actions scans BOTH
        # stdout and stderr for workflow commands (::group::, ::warning::,
        # ::error::, ::notice::). $GITHUB_STEP_SUMMARY and $GITHUB_OUTPUT are
        # already present in every step's environment; pr-hero writes to
        # them directly when --ci is set, so nothing here has to plumb them.
        #
        # The PR number is not re-derived here: the trigger step owns it, and
        # it reports a missing number as an error before this step can run.

        # --ci is unconditional: --budget-usd, --step-summary and --ci-mode
        # all require it at parse time, and it is what puts the CLI into
        # headless CI mode. The job's exit code still does not carry the
        # findings (ciExitCode): the pr-hero commit status does. In gate mode
        # (the default) that status is the required check; in advisory it
        # stays green. --yes skips the interactive confirmation prompt, which
        # has no TTY to run against here.
        set -- review --pr "$TRIGGER_PR" --ci --yes
        if [ "$POST_INPUT" = "true" ] && [ "$POST_FROM_PLATFORM" != "true" ]; then set -- "$@" --post; fi
        if [ "$SCOUT_INPUT" = "true" ]; then set -- "$@" --scout; fi
        if [ "$STEP_SUMMARY_INPUT" = "false" ]; then set -- "$@" --no-step-summary; fi
        if [ -n "$MODEL_INPUT" ]; then set -- "$@" --model "$MODEL_INPUT"; fi
        if [ -n "$MAX_CHANGED_LINES_INPUT" ]; then set -- "$@" --max-changed-lines "$MAX_CHANGED_LINES_INPUT"; fi
        if [ -n "$MAX_CHANGED_FILES_INPUT" ]; then set -- "$@" --max-changed-files "$MAX_CHANGED_FILES_INPUT"; fi
        if [ -n "$BUDGET_USD_INPUT" ]; then set -- "$@" --budget-usd "$BUDGET_USD_INPUT"; fi
        if [ -n "$MODE_INPUT" ]; then set -- "$@" --ci-mode "$MODE_INPUT"; fi
        if [ "$TRIGGER_FORCE" = "true" ]; then set -- "$@" --force; fi
        if [ "$TRIGGER_FULL" = "true" ]; then set -- "$@" --full; fi
        if [ "$TRIGGER_ADJUDICATE" = "true" ]; then set -- "$@" --adjudicate; fi
        if [ -n "$CRYSK_REPO_CONFIG" ]; then set -- "$@" --config "$CRYSK_REPO_CONFIG"; fi

        # The CLI is the last command, so the job's result is exactly the CLI's.
        # Nothing here writes a marker after it: the CLI's cli.json is its own
        # record of the outcome, and the publish step reads it. src/ci/run.ts
        # reads the crysk-secrets input on stdin to EOF, then runs the same CLI
        # bin/pr-hero.js runs, with these arguments; under pipefail the step's
        # exit is still the CLI's (printf cannot fail on a drained pipe).
        printf '%s' "$CRYSK_SECRETS_INPUT" | CRYSK_SECRETS_INPUT= bun "${{ github.action_path }}/src/ci/run.ts" "$@"

    # Refresh the Crysk token (platform mode only). The installation token from
    # `Connect to Crysk` was minted before the trigger and lives about an hour,
    # while Run Crysk may run for up to 75 minutes, so the late GitHub writes of
    # this job (the publish step's status, comment and cleanup) take a freshly
    # exchanged token instead: the same src/ci/platform.ts, the same masking,
    # the same loud failure. Run Crysk's own early (pending status) and
    # terminal posts run inside that one step and keep the token it started
    # with: an action.yml step cannot swap its own env mid-run.
    - name: Refresh the Crysk token
      id: platform-publish
      if: ${{ !cancelled() && steps.trigger.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs['dispatch-id'] != '' }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        CRYSK_DISPATCH_ID: ${{ github.event.inputs['dispatch-id'] }}
      run: bun "${{ github.action_path }}/src/ci/platform.ts"

    # Speaks for every outcome of a run (T2b, S3, T2c): no credential, a pull
    # request that cannot be resolved, a commenter permission that could not be
    # verified, a failed install step, and the review the CLI started. It reads
    # the records the trigger, the setup step and the CLI left, and posts ONE
    # annotation, ONE step summary, ONE commit status and ONE sticky comment for
    # an outcome it owns. A completed review posts only the cleanup of older
    # comments, and a skip or a yield is left to the CLI's own notice.
    #
    # WHY !cancelled(), not always(): the outcome this step reports is the one
    # where an earlier step FAILED, and a failed step skips every later one, so
    # this step must run after a failure (a failed install is a failure, not a
    # cancellation). It must NOT run after a cancellation: the scaffolded
    # workflow cancels a superseded run (`cancel-in-progress`), and a cancelled
    # job still reaches its always() steps, as the Upload step's comment below
    # says. Under always(), a run cancelled before its Run step writes
    # `cli-started` would publish a false CRYSK-INSTALL-FAILED on the superseded
    # head.
    #
    # WHY gated on `publish`, not on `run`: `run` is false for every outcome
    # this step reports.
    #
    # WHY builtins only: it runs before any install, like the trigger. The one
    # relative imports are builtins-only modules (src/ci/outcome.ts and
    # src/brand.ts), which need no node_modules.
    #
    # Once the cli-started marker exists, the CLI's cli.json decides. A reviewed
    # run deletes pr-hero's own older outcome comments, since a completed review
    # contradicts them: an older run's comments go, and so does an earlier
    # attempt of the same run. An error, a hunters-failed run, or a run that left
    # no record is published here with its code, because the CLI posts no
    # comment for those. A run that stopped before it reported is named as such.
    - name: Publish Crysk outcome
      id: publish
      # Wrapped in ${{ }}: a bare `!cancelled()` is a YAML tag, not an expression.
      if: ${{ !cancelled() && steps.trigger.outputs.publish == 'true' }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        GH_TOKEN: ${{ steps.platform-publish.outputs.github-token || steps.platform.outputs.github-token || inputs.github-token }}
        CRYSK_OUTCOME_DIR: ${{ runner.temp }}/pr-hero-outcome
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        # Bound like the run id: a record of another attempt of this run is
        # refused, since gh run rerun keeps the run id.
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: bun "${{ github.action_path }}/src/ci/publish.ts"

    # Platform mode only: tell the Crysk platform how this run ended, so every
    # run is recorded with its cost. The report posts metadata only (counts,
    # token and cost totals, models, shas), never a finding or any text of the
    # review, to the constant URL in src/ci/platform.ts, with the newest run
    # token (the refresh step's, else the first exchange's). It also carries the gate's
    # count of open blocking findings and their ids and statuses, which hold no text.
    # Once the report is
    # accepted the same script uploads the run's findings (findings.json's
    # `findings` array only) to /runs/findings with that token.
    #
    # WHY !cancelled() and not success(): a failed or skipped review is a run
    # too, and it still has an outcome to record; a cancelled one is a
    # superseded run that never had one. It is gated on a run token being
    # present, so a standalone run never reaches it.
    #
    # WHY it cannot turn the job red: the script prints a `::warning::` with the
    # HTTP status and the API's message and exits 0, for the report and for the
    # findings upload alike. The review's own result stands. Builtins only, like
    # publish: it runs even when nothing installed.
    - name: Report to Crysk
      id: report
      if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs['dispatch-id'] != '' && (steps.trigger.outputs.run == 'true' || steps.trigger.outputs.publish == 'true') && (steps.platform-publish.outputs.run-token != '' || steps.platform.outputs.run-token != '') }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        CRYSK_RUN_TOKEN: ${{ steps.platform-publish.outputs.run-token || steps.platform.outputs.run-token }}
        # From the same exchange as the run token (the refresh after the run
        # when it ran, else the first): the repository's data mode decides
        # whether finding text may leave the runner at all, and the first one
        # can be a run's length old. Anything but `full` (including an empty
        # value) is read as metadata_only.
        CRYSK_DATA_MODE: ${{ steps.platform-publish.outputs.data-mode || steps.platform.outputs.data-mode }}
        CRYSK_OUTCOME: ${{ steps.run-crysk.outputs.status }}
        CRYSK_RUN_DIR: ${{ steps.run-crysk.outputs.run_dir }}
        TRIGGER_PR: ${{ steps.trigger.outputs.pr }}
        TRIGGER_HEAD_SHA: ${{ steps.trigger.outputs.head_sha }}
      run: bun "${{ github.action_path }}/src/ci/platform-report.ts"

    # The same exchange again, for a run that was cancelled (see "Refresh the
    # Crysk token" above): the settle's post must not ride a token minted at the
    # start of a long run. A fresh OIDC token is a fresh identity, so the
    # platform exchanges it again.
    - name: Refresh the Crysk token (cancelled run)
      id: platform-settle
      if: ${{ cancelled() && steps.trigger.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs['dispatch-id'] != '' }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        CRYSK_DISPATCH_ID: ${{ github.event.inputs['dispatch-id'] }}
      run: bun "${{ github.action_path }}/src/ci/platform.ts"

    # WHY a separate step: the publish step is !cancelled() on purpose (a
    # superseded run must not report a failure it never had), and a cancelled
    # run kills the CLI before its own signal settle lands, which left the
    # pr-hero status pending forever (sandbox `cancel` probe, SB3). This step
    # runs only on a cancel, and settles only this run's own pending on the head
    # the CLI locked, as CRYSK-CANCELLED.
    - name: Settle a cancelled review
      id: cancel-settle
      if: ${{ cancelled() && steps.trigger.outputs.run == 'true' }}
      shell: bash
      env:
        # E-f F5: the Claude variables, emptied (see Connect to Crysk).
        ANTHROPIC_API_KEY: ''
        CLAUDE_CODE_OAUTH_TOKEN: ''
        ANTHROPIC_AUTH_TOKEN: ''
        CRYSK_CLAUDE_OAUTH_TOKEN: ''
        CRYSK_CLAUDE_API_KEY: ''
        GH_TOKEN: ${{ steps.platform-settle.outputs.github-token || steps.platform.outputs.github-token || inputs.github-token }}
        CRYSK_OUTCOME_DIR: ${{ runner.temp }}/pr-hero-outcome
        GITHUB_REPOSITORY: ${{ github.repository }}
        # The run id builds the status's target URL. The lock is this run's
        # because the trigger clears the outcome directory at job start.
        GITHUB_RUN_ID: ${{ github.run_id }}
        CRYSK_PUBLISH_MODE: cancelled
      run: bun "${{ github.action_path }}/src/ci/publish.ts"

    # Without this step the triage half of the review loop has no input.
    # `crysk triage reply --pr <n> --from <run-dir> --finding F00N` is the
    # ONLY supported way to answer a posted finding, and `--from` REQUIRES a
    # completed run directory on disk (findings.json maps F00N onto the
    # posted `<!-- pr-hero-finding` marker). In CI that directory lives at
    # `~/.crysk/repos/<host>/<owner>/<repo>/runs/pr-<n>-<sha>-1` on an
    # EPHEMERAL runner and dies with the job — so a PR reviewed in Actions
    # used to carry findings that literally could not be answered. It lives
    # in the action, not in the calling workflow, so every consumer gets it
    # without copying a step.
    #
    # `always()` is the load-bearing part. A review that FAILED is exactly
    # when this directory matters most: every hunter once died with
    # "Not logged in · Please run /login", and the per-attempt logs naming
    # that cause were only on the runner — recovering them took pushing a
    # throwaway debug commit to cat them off. It is still gated on the
    # trigger: a run that never reviewed has nothing to upload.
    #
    # KNOWN GAP, stated here so this comment does not overclaim: THREE
    # outcomes publish no usable `run_dir` and therefore skip this upload.
    # Every hunter died and a fatal error both leave it empty, and a
    # CANCELLED job never writes it at all — the SIGTERM/SIGINT handlers
    # kill the children and exit straight out, never reaching the only code
    # path that touches the job's output file. So the emptiness check below
    # suppresses the upload for exactly the cases `always()` was reached
    # for. Closing it needs the run step to publish `run_dir` on those paths.
    # Until then `always()` earns its place on the narrower set: a review
    # that RAN but could not post, and a later step in the job failing.
    #
    # WHAT IT CONTAINS: the reviewed diff (diff.patch), the rendered agent
    # prompts, every hunter draft, and findings.json. On a PUBLIC repository
    # workflow artifacts are downloadable by anyone, which is why retention
    # is deliberately short.
    #
    # Download it with:
    #   gh run download <run-id> -n crysk-run-<pr>-<head-sha>
    # then point `crysk triage reply --from` at the download directory.
    - name: Upload Crysk run directory
      # A size-gated, budget-gated or concurrent review writes no run
      # directory and publishes no outputs; the emptiness check keeps
      # upload-artifact from being handed an empty `path:` in that case.
      if: always() && steps.trigger.outputs.run == 'true' && steps.run-crysk.outputs.run_dir != ''
      uses: actions/upload-artifact@v4
      with:
        # Both the PR number and the head sha, so a download is unambiguous
        # when a PR is reviewed more than once — the run directory itself is
        # named `pr-<n>-<sha>-1` for the same reason. Both come from the
        # trigger, because a comment event carries no pull_request payload.
        name: crysk-run-${{ steps.trigger.outputs.pr }}-${{ steps.trigger.outputs.head_sha }}
        path: ${{ steps.run-crysk.outputs.run_dir }}
        # upload-artifact excludes hidden files by default since v4.4, and
        # this directory lives under a hidden `~/.crysk` ancestor. Paired
        # with `if-no-files-found: warn` below, an exclusion here would
        # produce an EMPTY artifact plus a warning nobody reads.
        include-hidden-files: true
        # NEVER `error`: a skipped review is working as designed and must
        # not turn the job red.
        if-no-files-found: warn
        # Artifact names are unique per workflow RUN, and `gh run rerun` —
        # which the trigger's own no-credentials summary tells people to
        # use — reuses the run id. Without this, the second attempt's upload
        # conflicts and `always()` turns an otherwise green re-run red.
        overwrite: true
        # Long enough to triage, short enough to limit exposure of the diff
        # and prompts above on a public repository.
        retention-days: 7
