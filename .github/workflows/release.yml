name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # The compiled binary embeds its version from the TAG (see "Compile
  # standalone binary" below: __PRHERO_VERSION__ reads GITHUB_REF_NAME),
  # while `npm publish` ships whatever package.json's "version" field says.
  # Those are two independently-settable strings for the same release — a
  # tagging mistake (forgetting to bump package.json, or tagging the wrong
  # commit) ships two different version numbers under one release, silently.
  # Catch it here, before anything is built or published.
  verify-version:
    name: Verify tag matches package.json version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compare tag to package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.json's version (${PKG_VERSION}). The compiled binary would embed ${TAG_VERSION} while npm would publish ${PKG_VERSION} under the same release. Bump package.json (and src/index.ts's ENGINE_VERSION) to match before tagging, or re-tag the correct commit."
            exit 1
          fi

  build-binaries:
    name: Build binaries
    needs: verify-version
    strategy:
      # What this buys, precisely: when one leg fails, the others still finish
      # and upload. It does NOT keep the release publishing — `publish-release`
      # below has a bare `needs: build-binaries`, so a failed leg makes that job
      # skip and nothing is published either way.
      #
      # That skip is deliberate and should stay. A release missing one
      # platform's binary is worse than no release: install.sh resolves a
      # per-platform download URL, so a partial publish turns into a 404 for
      # whoever is on the missing architecture, while a failed release simply
      # leaves the previous version installable.
      #
      # The value is diagnostic and it is real: a broken run reports every
      # failing leg instead of only the first, and the three good artifacts are
      # built and attached, so the re-run after a fix has somewhere to start.
      fail-fast: false
      matrix:
        # EVERY runner here must be able to EXECUTE what it builds, because the
        # smoke below runs the artifact before it is uploaded. That is why
        # darwin-x64 builds on macos-15-intel rather than on the arm64
        # macos-latest: cross-compiling it there would leave one of four
        # published binaries never once executed — the exact gap this workflow
        # exists to close — and leaning on Rosetta instead would make the gate
        # flaky rather than honest.
        #
        # macos-15-intel is a standard GitHub-hosted label (its predecessor
        # macos-13 was retired in December 2025), and standard runners are free
        # and unlimited on public repositories.
        #
        # Keep this invariant when adding a target: pick a runner of the target's
        # own architecture. test/packaging.test.ts parses this matrix and fails
        # if any target is uploaded without being smoked.
        include:
          - os: macos-latest
            target: darwin-arm64
            bun_target: bun-darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
            bun_target: bun-darwin-x64
          - os: ubuntu-latest
            target: linux-x64
            bun_target: bun-linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            bun_target: bun-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification test suite
        run: |
          bun test
          bun run typecheck
          bun run check

      - name: Compile standalone binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun build --compile --target=${{ matrix.bun_target }} --minify --no-compile-autoload-dotenv --no-compile-autoload-bunfig --define __PRHERO_VERSION__="\"${VERSION}\"" src/cli.ts --outfile crysk-${{ matrix.target }}

      # Runs THE ARTIFACT ABOUT TO BE UPLOADED, not a rebuild of it: a smoke
      # that compiles its own binary would prove nothing about this one. Placed
      # before the upload on purpose — a binary that cannot resolve its own
      # bundled assets must never reach a release page. That is exactly what
      # v1.0.0 did, and this job was green when it happened.
      - name: Compiled-binary smoke
        run: bun run scripts/compiled-smoke.ts ./crysk-${{ matrix.target }}

      # For one version the release carries every binary under both names: an
      # installed pr-hero's `pr-hero upgrade` downloads pr-hero-<target>. A
      # copy of the binary smoked above, never a second compile, so the two
      # assets are byte-identical.
      - name: Copy binary to the legacy pr-hero asset name
        run: cp crysk-${{ matrix.target }} pr-hero-${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            crysk-${{ matrix.target }}
            pr-hero-${{ matrix.target }}

  publish-release:
    name: Publish GitHub Release & NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm distribution bundle
        run: bun run build

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-binaries
          sha256sum crysk-* pr-hero-* > SHA256SUMS
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/crysk-*
            release-binaries/pr-hero-*
            release-binaries/SHA256SUMS
          generate_release_notes: true
          # `pr-hero upgrade` and install.sh both resolve GitHub's "latest
          # release" (SemVer-highest is GitHub's own default, not ours to
          # rely on). After the 1.x -> 0.x renumbering, 0.2.0 is SemVer-LOWER
          # than the already-published 1.1.0 — without this, GitHub would
          # keep calling 1.1.0 latest forever and every upgrade/install would
          # silently stay stuck on the old numbering.
          # Scoped to stable tags: the trigger also matches suffixed tags
          # (v0.2.0-rc.1), and one of those becoming "latest" would ship an
          # RC to every install and upgrade. Same rule the floating-tag step
          # below applies. A backport tag for an older line would still win
          # "latest"; there is only one release line today.
          make_latest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update major floating tag
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="${GITHUB_REF_NAME%%.*}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "${MAJOR}" -m "Release ${GITHUB_REF_NAME}"
            git push origin "${MAJOR}" --force
          fi

      - name: Publish to NPM
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public

