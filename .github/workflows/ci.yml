# Verifies this repository's own suite. Until this file existed,
# .github/workflows/ held only release.yml, so nothing ran the tests on a
# pull request and every merge to main was verified by whoever remembered to
# run the gates by hand.
#
# Not to be confused with pr-hero.yml, which runs the *reviewer* on a PR.
# That one reads the diff and comments; this one proves the code still works.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Read-only: this workflow proves the code, it never writes to the repo.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref. main is exempt:
  # every commit that lands there deserves its own recorded verdict.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Test, typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: a runtime that changes under you turns an
          # unrelated upstream release into a red build on an innocent PR.
          # The one pin is package.json's `packageManager`, which action.yml reads too.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The whole suite is offline by design — fake spawn/runner throughout,
      # no network, no real agent calls, no API keys. That is precisely why it
      # can run on every pull request without costing anything.
      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # ./node_modules/.bin/biome, never `bunx biome`. Bare `biome` resolves
      # to an unrelated abandoned package that ignores the flags, checks
      # nothing, and exits 0 — docs/research/scout-design.md:344 records this gate sitting
      # green for 18 days on exactly that while real Biome found 10 errors
      # over the same commit. A linter that always passes is worse than no
      # linter, because it is trusted. test/packaging.test.ts pins this line.
      - name: Lint
        run: ./node_modules/.bin/biome check src test

      # Everything above runs from SOURCE, where `import.meta.dir` names a real
      # directory and the engine always reports asset mode "dev". The published
      # artifact is a Bun-compiled binary whose assets live at hashed paths in a
      # virtual filesystem, and no test above can reach that runtime. v1.0.0
      # shipped a binary whose `review` failed for every user past a fully green
      # version of this job. This step builds the artifact and runs it.
      # Free: `--dry-run` returns before the capability gate, so no `claude`, no
      # credentials and no network are involved, and nothing is spawned.
      - name: Compiled-binary smoke
        run: bun run scripts/compiled-smoke.ts
