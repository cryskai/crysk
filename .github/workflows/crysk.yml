# Managed by the Crysk GitHub App. Crysk dispatches this workflow for each review; you do not
# need to edit it. Configure reviews from the Crysk dashboard, or with a crysk config file in
# this repository, which wins when present.
name: Crysk Review

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request to review
        required: true
      force:
        description: Bypass the skip gates
        required: false
        default: "false"
      full:
        description: Re-discover the whole range
        required: false
        default: "false"
      dispatch-id:
        description: Correlates this run with the Crysk dispatch that started it
        required: false
        default: ""
      cancel:
        description: Cancel this pull request's review in progress (only for a new push)
        required: false
        default: "false"
      opencode-providers:
        description: OpenCode providers this review uses, as secret tokens (JSON array sent by Crysk)
        required: false
        default: "[]"

run-name: Crysk review of #${{ inputs.pr-number }}

# Same scopes as the standalone workflow, plus id-token so the run can prove to Crysk which
# repository it belongs to without a Crysk key in your secrets.
permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: write
  id-token: write

# A new push makes the review in progress obsolete, so Crysk sends cancel=true only then. Any other
# dispatch (a comment command, a reopened PR) queues behind the running review instead of killing a
# paid run. GitHub keeps one pending run per group; a newer one replaces it.
concurrency:
  group: crysk-review-${{ inputs.pr-number }}
  cancel-in-progress: ${{ inputs.cancel == 'true' }}

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # The engine reads the pull request's diff and history from git, so it needs the PR head
      # with full history (a shallow clone silently loses context).
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr-number }}/head
          fetch-depth: 0
      - uses: cryskai/crysk@v0
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          force: ${{ inputs.force }}
          full: ${{ inputs.full }}
          # Your credentials stay in your repository's secrets, set from the Crysk dashboard. Each
          # one is named here, the OpenCode keys by the providers this review uses; a secret you
          # have not set arrives empty and is ignored.
          crysk-secrets: |
            CRYSK_CLAUDE_OAUTH_TOKEN=${{ secrets.CRYSK_CLAUDE_OAUTH_TOKEN }}
            CRYSK_CLAUDE_API_KEY=${{ secrets.CRYSK_CLAUDE_API_KEY }}
            CRYSK_OPENCODE_OPENAI_OAUTH=${{ secrets.CRYSK_OPENCODE_OPENAI_OAUTH }}
            CRYSK_OPENCODE_${{ fromJSON(inputs.opencode-providers)[0] }}_API_KEY=${{ secrets[format('CRYSK_OPENCODE_{0}_API_KEY', fromJSON(inputs.opencode-providers)[0])] }}
            CRYSK_OPENCODE_${{ fromJSON(inputs.opencode-providers)[1] }}_API_KEY=${{ secrets[format('CRYSK_OPENCODE_{0}_API_KEY', fromJSON(inputs.opencode-providers)[1])] }}
            CRYSK_OPENCODE_${{ fromJSON(inputs.opencode-providers)[2] }}_API_KEY=${{ secrets[format('CRYSK_OPENCODE_{0}_API_KEY', fromJSON(inputs.opencode-providers)[2])] }}
            CRYSK_OPENCODE_${{ fromJSON(inputs.opencode-providers)[3] }}_API_KEY=${{ secrets[format('CRYSK_OPENCODE_{0}_API_KEY', fromJSON(inputs.opencode-providers)[3])] }}
            CRYSK_OPENCODE_${{ fromJSON(inputs.opencode-providers)[4] }}_API_KEY=${{ secrets[format('CRYSK_OPENCODE_{0}_API_KEY', fromJSON(inputs.opencode-providers)[4])] }}
